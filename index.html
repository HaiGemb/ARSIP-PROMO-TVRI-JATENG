<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Arsip Promo - TVRI Jawa Tengah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Script untuk Google Identity Services (OAuth2) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-[#003366] text-white p-6 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Arsip Bidang Promo</h1>
                <p class="text-sm text-cyan-400">LPP TVRI Stasiun Jawa Tengah</p>
            </div>
            <button onclick="openModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded shadow">
                + Tambah Arsip
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto mt-8 p-4">
        <!-- Filter & Search -->
        <div class="bg-white p-4 rounded shadow mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <input type="text" id="searchInput" placeholder="Cari judul arsip..." class="border p-2 rounded w-full md:w-1/3" onkeyup="renderTable()">
            <select id="filterCategory" class="border p-2 rounded w-full md:w-1/4" onchange="renderTable()">
                <option value="All">Semua Kategori</option>
                <option value="PROMO ACARA TV">PROMO ACARA TV</option>
                <option value="FILLER PROMO">FILLER PROMO</option>
                <option value="SATU HARI SATU FAKTA">SATU HARI SATU FAKTA</option>
                <option value="REPACKED PAT">REPACKED PAT</option>
                <option value="GREATING">GREATING</option>
                <option value="ILM">ILM</option>
                <option value="BUGS">BUGS</option>
                <option value="PROMO PNBP">PROMO PNBP</option>
            </select>
        </div>

        <!-- Table -->
        <div class="bg-white rounded shadow overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700">
                        <th class="p-3 border-b">No</th>
                        <th class="p-3 border-b">Judul Arsip</th>
                        <th class="p-3 border-b">Kategori</th>
                        <th class="p-3 border-b">Tanggal</th>
                        <th class="p-3 border-b text-center">Link Drive</th>
                        <th class="p-3 border-b text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <!-- Data will be rendered here via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Form Tambah Arsip -->
    <div id="formModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 border-b pb-2 text-[#003366]">Form Arsip Promo</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1">Judul Arsip</label>
                <input type="text" id="inputJudul" class="border p-2 rounded w-full" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1">Kategori</label>
                <select id="inputKategori" class="border p-2 rounded w-full" required>
                    <option value="PROMO ACARA TV">PROMO ACARA TV</option>
                    <option value="FILLER PROMO">FILLER PROMO</option>
                    <option value="SATU HARI SATU FAKTA">SATU HARI SATU FAKTA</option>
                    <option value="REPACKED PAT">REPACKED PAT</option>
                    <option value="GREATING">GREATING</option>
                    <option value="ILM">ILM</option>
                    <option value="BUGS">BUGS</option>
                    <option value="PROMO PNBP">PROMO PNBP</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1">Tanggal</label>
                <input type="date" id="inputTanggal" class="border p-2 rounded w-full" required>
            </div>

            <!-- Bagian Upload Google Drive -->
            <div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded">
                <label class="block text-sm font-bold text-blue-800 mb-2">Upload ke Google Drive</label>
                <input type="file" id="inputFile" class="text-sm w-full mb-2">
                <button type="button" onclick="uploadToDrive()" id="btnUpload" class="bg-blue-600 hover:bg-blue-700 text-white text-sm py-1 px-3 rounded w-full transition">
                    🚀 Upload File
                </button>
                <p id="uploadStatus" class="text-xs mt-2 text-gray-600"></p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold mb-1">Link Google Drive</label>
                <input type="url" id="inputLink" placeholder="Terisi otomatis jika upload berhasil" class="border p-2 rounded w-full bg-gray-100" required>
            </div>

            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded text-gray-800">Batal</button>
                <button onclick="saveData()" class="bg-[#003366] hover:bg-blue-800 text-white px-4 py-2 rounded">Simpan</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // KONFIGURASI GOOGLE DRIVE API
        // ==========================================
        // ANDA WAJIB MENGGANTI INI DENGAN CLIENT ID DARI GOOGLE CLOUD CONSOLE
        const CLIENT_ID = 'GANTI_DENGAN_CLIENT_ID_ANDA.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        
        let tokenClient;
        let accessToken = null;

        // Inisialisasi Google Identity Services saat halaman dimuat
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        executeUpload(); // Lanjut upload setelah dapat izin
                    }
                },
            });
            renderTable();
        };

        // Fungsi pemicu upload
        function uploadToDrive() {
            const fileInput = document.getElementById('inputFile');
            if (fileInput.files.length === 0) {
                alert('Pilih file terlebih dahulu!');
                return;
            }
            // Jika belum ada akses token, minta user login/izin
            if (!accessToken) {
                tokenClient.requestAccessToken();
            } else {
                executeUpload();
            }
        }

        // Eksekusi upload file ke Drive via REST API
        async function executeUpload() {
            const file = document.getElementById('inputFile').files[0];
            const statusText = document.getElementById('uploadStatus');
            const btnUpload = document.getElementById('btnUpload');
            
            statusText.innerText = "Mengunggah file... Mohon tunggu.";
            statusText.className = "text-xs mt-2 text-amber-600 font-bold";
            btnUpload.disabled = true;

            const metadata = {
                'name': file.name, 
                'mimeType': file.type
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form
                });
                
                const data = await response.json();
                
                if (data.webViewLink) {
                    document.getElementById('inputLink').value = data.webViewLink;
                    statusText.innerText = "Upload berhasil! Link telah disalin.";
                    statusText.className = "text-xs mt-2 text-green-600 font-bold";
                } else {
                    throw new Error("Gagal mendapatkan link");
                }
            } catch (error) {
                console.error(error);
                statusText.innerText = "Terjadi kesalahan saat upload.";
                statusText.className = "text-xs mt-2 text-red-600 font-bold";
            } finally {
                btnUpload.disabled = false;
            }
        }

        // ==========================================
        // LOGIC DATABASE LOKAL (CRUD)
        // ==========================================
        let arsipData = JSON.parse(localStorage.getItem('arsipTvri')) || [];

        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('filterCategory').value;
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';

            let filtered = arsipData.filter(item => {
                const matchSearch = item.judul.toLowerCase().includes(search);
                const matchCategory = category === 'All' || item.kategori === category;
                return matchSearch && matchCategory;
            });

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-4 text-gray-500">Tidak ada data arsip ditemukan.</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3 font-medium text-gray-800">${item.judul}</td>
                        <td class="p-3"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-semibold">${item.kategori}</span></td>
                        <td class="p-3 text-sm text-gray-600">${item.tanggal}</td>
                        <td class="p-3 text-center">
                            <a href="${item.link}" target="_blank" class="text-cyan-600 hover:text-cyan-800 font-bold text-sm underline">Buka Drive</a>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="deleteData(${item.id})" class="text-red-500 hover:text-red-700 text-sm font-bold">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function saveData() {
            const judul = document.getElementById('inputJudul').value;
            const kategori = document.getElementById('inputKategori').value;
            const tanggal = document.getElementById('inputTanggal').value;
            const link = document.getElementById('inputLink').value;

            if(!judul || !tanggal || !link) {
                alert("Harap isi semua data atau lakukan upload terlebih dahulu!");
                return;
            }

            arsipData.push({
                id: Date.now(),
                judul: judul,
                kategori: kategori,
                tanggal: tanggal,
                link: link
            });

            localStorage.setItem('arsipTvri', JSON.stringify(arsipData));
            closeModal();
            renderTable();
            
            // Reset input
            document.getElementById('inputJudul').value = '';
            document.getElementById('inputTanggal').value = '';
            document.getElementById('inputLink').value = '';
            document.getElementById('inputFile').value = '';
            document.getElementById('uploadStatus').innerText = '';
        }

        function deleteData(id) {
            if(confirm("Apakah Anda yakin ingin menghapus arsip ini?")) {
                arsipData = arsipData.filter(item => item.id !== id);
                localStorage.setItem('arsipTvri', JSON.stringify(arsipData));
                renderTable();
            }
        }

        function openModal() {
            document.getElementById('formModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('formModal').classList.remove('active');
        }
    </script>
</body>
</html>
